plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rynotec.pos'
    compileSdk 34

    defaultConfig {
        applicationId   "com.rynotec.pos"
        minSdk          26
        targetSdk       34
        versionCode     2
        versionName     "2.0.0"

        // Override these in local.properties or your CI secrets
        buildConfigField 'String', 'BACKEND_URL',       '"https://api.ryno-tec.co.za"'
        buildConfigField 'String', 'MERCHANT_API_KEY',  '"REPLACE_ME"'
        buildConfigField 'String', 'MERCHANT_ID',       '"TERMINAL-001"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            buildConfigField 'String', 'BACKEND_URL', '"http://10.0.2.2:3000"'
        }
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
