plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.consumer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.consumer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // HMS Core — must be installed on the device for Wallet Kit to work.
    // Check https://developer.huawei.com/consumer/en/doc/development/HMSCore-Guides
    // for the latest release number.
    implementation 'com.huawei.hms:base:6.11.0.302'
    implementation 'com.huawei.hms:wallet:6.11.0.302'

    // Backend API calls (PassApiClient)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
