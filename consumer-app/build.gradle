plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rynotec.pass'
    compileSdk 34

    defaultConfig {
        applicationId "com.rynotec.pass"
        minSdk        26
        targetSdk     34
        versionCode   2
        versionName   "2.0.0"

        buildConfigField 'String', 'BACKEND_URL', '"https://api.ryno-tec.co.za"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            buildConfigField 'String', 'BACKEND_URL', '"http://10.0.2.2:3000"'
        }
        release {
            minifyEnabled   true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // HMS Core — Wallet Kit; verify version against AppGallery Connect SDK download
    implementation 'com.huawei.hms:base:6.11.0.302'
    implementation 'com.huawei.hms:wallet:6.11.0.302'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
