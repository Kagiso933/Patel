version: '3.9'

services:
  backend:
    build:
      context: ./backend
    image: ryno-tec/nfc-pass-backend:latest
    container_name: rynotec-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local
